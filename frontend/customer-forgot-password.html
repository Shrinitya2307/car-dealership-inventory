```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Forgot Password</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                🔐
            </div>

            <h1>Forgot Password?</h1>

            <p class="subtitle">
                Reset your customer account password
            </p>


            <form id="customer-forgot-form">

                <div class="input-group">

                    <label>Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>New Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-btn"
                            onclick="togglePassword('newPassword', this)">
                            👁️
                        </button>

                    </div>

                </div>


                <div class="input-group">

                    <label>Confirm New Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-btn"
                            onclick="togglePassword('confirmPassword', this)">
                            👁️
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="auth-btn">

                    Reset Password

                </button>

            </form>


            <p
                id="message"
                class="message">
            </p>


            <div class="auth-footer">

                <p>
                    Remember your password?
                </p>

                <a href="customer-login.html">
                    ← Back to Customer Login
                </a>

            </div>


            <div class="back-link">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <script src="customer-forgot-password.js"></script>

</body>

</html>
```
