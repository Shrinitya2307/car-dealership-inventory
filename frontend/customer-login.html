```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Login</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                👤
            </div>

            <h1>Customer Login</h1>

            <p class="subtitle">
                Login to find your perfect car
            </p>


            <form id="customer-login-form">

                <div class="input-group">

                    <label>Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-btn"
                            onclick="togglePassword()">

                            👁️

                        </button>

                    </div>

                </div>


                <div class="forgot-password">

                    <a href="customer-forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-btn">

                    🔐 Login

                </button>

            </form>


            <p
                id="message"
                class="message">
            </p>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                </p>

                <a href="customer-register.html">
                    Create Customer Account
                </a>

            </div>


            <div class="back-link">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <script src="customer-login.js"></script>

</body>

</html>
```
