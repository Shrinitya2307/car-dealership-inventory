<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Admin</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                🔐
            </div>


            <h1>
                Reset Admin Password
            </h1>


            <p class="subtitle">
                Create a new password for your admin account
            </p>


            <form id="admin-forgot-form">


                <!-- USERNAME -->

                <div class="input-group">

                    <label>
                        Admin Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter admin username"
                        required
                    >

                </div>


                <!-- NEW PASSWORD -->

                <div class="input-group">

                    <label>
                        New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-btn"
                            onclick="togglePassword(
                                'newPassword',
                                this
                            )">

                            👁️

                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label>
                        Confirm New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-btn"
                            onclick="togglePassword(
                                'confirmPassword',
                                this
                            )">

                            👁️

                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="auth-btn">

                    🔐 Reset Password

                </button>


            </form>


            <p
                id="message"
                class="message">
            </p>


            <div class="auth-footer">

                <a href="admin-login.html">

                    ← Back to Admin Login

                </a>

            </div>


            <div class="back-link">

                <a href="index.html">

                    ← Back to Home

                </a>

            </div>


        </div>

    </div>


    <script src="admin-forgot-password.js"></script>

</body>

</html>
